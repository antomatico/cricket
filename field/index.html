<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set the Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a coach's chalkboard turned game — encouraging, quick, kid-readable.
   IDEA: the printed fielding sheet, brought to life as a mown oval you place pins on.
   PICTURE: the oval itself, large, with stripes, pitch, keeper and clock face.
   COLOUR and TYPE: grass greens, Eastern Suburbs maroon + navy, white lines; Oswald labels, Roboto body (from the club welcome guide).
   LAYOUT: header bar, field left + position tray right; stacks field-then-tray under 820px. */
:root{color-scheme:light dark;--cond:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
 --bg:light-dark(#FBF9FA,#0b0b0b);--panel:light-dark(#ffffff,#151515);--ink:light-dark(#2B2732,#ffffff);--muted:light-dark(#69626F,#b8b8b8);
 --line:light-dark(#E8E0E5,#333333);--g1:light-dark(#6aa857,#24572f);--g2:light-dark(#5e9c4c,#1f4e2a);--rope:light-dark(#ffffff,#d9e6dc);
 --pitch:light-dark(#d8c48c,#8f8257);--red:#87325B;--navy:#152764;--bar:light-dark(#87325B,#5C2240);--gold:#e8a917;--lab:light-dark(#ffffff,#0b0b0b);--labink:light-dark(#2B2732,#ffffff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Roboto,"Segoe UI",Arial,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;min-height:56px;padding:6px max(3vw,14px);background:var(--bar);color:#fff;border-bottom:3px solid var(--navy)}
.brand{display:flex;align-items:center;gap:10px}.crest{width:40px;height:40px;object-fit:contain;flex:none}
header h1{margin:0;font:600 clamp(20px,2.6vw,26px)/1.05 var(--cond);letter-spacing:.01em}
header h1 small{display:block;font:400 12px/1.3 Roboto,Arial,sans-serif;letter-spacing:0;opacity:.85}
.hud{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.score{font:500 18px var(--cond);background:#0002;border-radius:10px;padding:6px 12px;white-space:nowrap}
.tog{min-height:38px;border:1px solid #fff5;background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font-weight:600}
.tog[aria-pressed=true]{background:#fff;color:var(--red)}
.hint{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lux{display:flex;align-items:center;gap:8px;font:500 15px var(--cond);white-space:nowrap}.lux input{width:110px;accent-color:#ffe28a}
#field{--lux:.6}.lights .dim{opacity:calc(.55 - .55*var(--lux))}.lights .pool{opacity:calc(var(--lux)*.95);mix-blend-mode:screen}
#hints{pointer-events:none}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;padding:16px max(3vw,14px);max-width:1240px;margin:auto}
.fieldwrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}
#field{display:block;width:100%;height:auto;max-height:calc(100vh - 120px);touch-action:none;user-select:none}
.tray{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;align-self:start}
.tray h2{margin:0 0 2px;font:600 22px var(--cond)}.tray p{margin:0 0 10px;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:16px}
.chip{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;margin:0;height:40px;padding:0 9px;border-radius:7px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 17px/1.15 var(--cond);white-space:nowrap;touch-action:none;text-align:left}
.chip:hover{border-color:var(--g1)}
.chip.pending{border-color:var(--red);border-style:dashed}
.chip.done{opacity:.55;cursor:default;border-style:solid}.chip .pts{font-weight:700;color:var(--ink)}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%);background:var(--red);color:#fff;font:600 15px var(--cond);padding:4px 10px;border-radius:8px;box-shadow:0 6px 18px #0004}
.pop{position:absolute;z-index:20;width:230px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 12px 30px #0003;text-align:center}
.pop b{display:block;font:600 18px var(--cond);margin-bottom:8px}
.pop div{display:flex;gap:8px}.pop button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600}
.pop .yes{background:var(--red);border-color:var(--red);color:#fff}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:25;background:var(--navy);color:#fff;padding:8px 16px;border-radius:999px;font:600 18px var(--cond);max-width:92%;text-align:center;transition:opacity .3s;pointer-events:none}
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:#0a1a10aa;overflow:auto}
.card{width:min(560px,100%);background:var(--panel);color:var(--ink);border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:0 20px 60px #0006}
.card{position:relative}.x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:26px;line-height:1}
.card h2{padding-right:44px;margin:0 0 6px;font:600 clamp(28px,5vw,40px)/1.05 var(--cond);text-wrap:balance}
.card p{margin:0 0 14px;color:var(--muted)}
label.f{display:block;font-weight:600;margin:10px 0 4px}
input[type=text]{width:100%;font:16px Roboto,Arial,sans-serif;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:8px}.seg button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600}
.seg button[aria-pressed=true]{border-color:var(--red);background:var(--red);color:#fff}
.go{width:100%;margin-top:16px;min-height:50px;border:0;border-radius:12px;background:var(--red);color:#fff;font:600 20px var(--cond)}
.go.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:8px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:13px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.me td{background:light-dark(#fdf1d6,#3a3214);font-weight:700}
.lb h3{margin:18px 0 0;font:600 20px var(--cond)}.note{font-size:13px;color:var(--muted);margin-top:8px}
.big{font:600 clamp(48px,10vw,72px)/1 var(--cond);color:var(--red)}
.lbl rect{fill:var(--lab);stroke:var(--line)}.lbl text{fill:var(--labink);font-family:var(--cond);font-weight:600}
.lbl.pend rect{fill:var(--red);stroke:none}.lbl.pend text{fill:#fff}
.clock{display:none}.showclock .clock{display:inline}
.night{opacity:0}:root[data-theme=dark] .night{opacity:1}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .night{opacity:1}}
@media(max-width:820px){.crest{width:34px;height:34px}.toast{font-size:16px}main{grid-template-columns:minmax(0,1fr)}}
.zoom{position:absolute;right:12px;bottom:12px;z-index:15;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:600 22px/1 var(--cond);box-shadow:0 3px 10px #0002;display:grid;place-items:center;padding:0}
.zoom .zr{font-size:13px}
/* Phone held sideways: slim header, field fills the height on the left, two scrolling columns of positions on the right */
@media (orientation:landscape) and (max-height:520px){
 body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
 header{flex-wrap:nowrap;min-height:0;padding:4px 10px;gap:8px;border-bottom-width:2px}
 header h1{font-size:18px;white-space:nowrap}header h1 small{display:none}.crest{width:28px;height:28px}
 .hud{flex-wrap:nowrap;gap:5px}.score{font-size:15px;padding:4px 8px}
 .tog{min-height:34px;padding:3px 10px;font-size:13px;white-space:nowrap}
 .lux{font-size:13px;gap:5px}.lux input{width:70px}
 main{flex:1;min-height:0;max-width:none;width:100%;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:6px 8px calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
 .fieldwrap{height:100%;aspect-ratio:655/712;padding:3px;border-radius:12px}
 #field{width:100%;height:100%;max-height:none}
 .tray{height:100%;overflow-y:auto;padding:8px;border-radius:12px;align-self:stretch;overscroll-behavior:contain}
 .tray h2{font-size:17px;margin:0 0 2px}.tray p{display:none}
 .chip{font-size:15.5px;padding:0 7px}
 .zoom{right:8px;bottom:8px;gap:5px}.zoom button{width:36px;height:36px;font-size:19px}
 .toast{font-size:15px;top:8px}.pop{width:210px;padding:9px}.pop button{min-height:40px}
}
@keyframes pulse{50%{transform:scale(1.15)}}.pulse{animation:pulse .6s 2;transform-box:fill-box;transform-origin:50% 100%}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<header>
 <div class="brand"><img class="crest" src="https://prodcdn.sporty.co.nz/cms/13818/83131/1442870/bf252aa4-da9f-4931-8a67-9d34d3b929ef_wo.png?t=638882118001570000" alt="Eastern Suburbs Cricket Club logo" width="40" height="40" onerror="this.remove()"><h1>Set the Field<small>Eastern Suburbs · Gladiators fielding challenge</small></h1></div>
 <div class="hud">
  <span class="score" id="score">0 pts · 0/20</span>
  <button class="tog hint" id="tHint" aria-pressed="false" title="Press and hold to see every position circle (costs 1 DDP)">Hold for hint</button>
  <button class="tog" id="tClock" aria-pressed="false">Clock face</button>
  <button class="tog" id="tNight" aria-pressed="false">Night mode</button>
  <label class="lux" id="luxWrap" hidden>Floodlights <input type="range" id="lux" min="0" max="100" value="60" aria-label="Floodlight brightness"></label>
 </div>
</header>
<main>
 <div class="fieldwrap" id="wrap">
  <svg id="field" viewBox="0 100 655 712" aria-label="Cricket field">
   <defs>
    <pattern id="mow" width="655" height="44" patternUnits="userSpaceOnUse"><rect width="655" height="22" style="fill:var(--g1)"/><rect y="22" width="655" height="22" style="fill:var(--g2)"/></pattern>
    <pattern id="mowv" width="44" height="712" patternUnits="userSpaceOnUse"><rect width="22" height="712" fill="#fff" fill-opacity=".09"/><rect x="22" width="22" height="712" fill="#000" fill-opacity=".05"/></pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7cf" stop-opacity=".2"/><stop offset=".3" stop-color="#fff7cf" stop-opacity=".62"/><stop offset=".75" stop-color="#fff7cf" stop-opacity=".42"/><stop offset="1" stop-color="#fff7cf" stop-opacity=".18"/></linearGradient>
    <filter id="feather" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="fclip"><ellipse cx="326.75" cy="453.5" rx="284.75" ry="314.5"/></clipPath>
    <radialGradient id="flood" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#fffbe0" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
   </defs>
   <g id="base"></g><g id="marks"></g><g id="hints"></g><circle id="hint" r="0" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 4" opacity="0"/><g id="labels"></g><g id="pinLayer"></g>
  </svg>
  <div class="pop" id="pop" hidden><b>Is this your final placement?</b><div><button class="mv" id="pMove">No, move it</button><button class="yes" id="pYes">Yes, lock it in</button></div></div>
  <div class="toast" id="toast" style="opacity:0"></div>
  <div class="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button class="zr" id="zReset" aria-label="Reset zoom" hidden>1×</button></div>
 </div>
 <aside class="tray"><h2>Positions</h2><p>Drag each one onto the field. The tip of the pin is the exact spot.</p><div class="chips" id="chips"></div></aside>
</main>
<div class="overlay" id="ov"><div class="card"><button class="x" id="ovx" aria-label="Close">&times;</button><div id="card"></div></div></div>
<div class="ghost" id="ghost" hidden></div>
<script>
{
/* ---------- Data: positions measured from the coach's printed sheet (right-handed batter) ---------- */
const POS=[["Slip",302,351],["Gully",251,375.8],["Backward point",212.5,369.8],["Deep backward point",88.8,325.8],["Point",216.5,408.5],["Deep point",59.8,409.5],["Cover",206.2,454],["Extra cover",226.5,522.5],["Deep extra cover",87.8,581],["Mid off",261.2,589],["Deep mid off",157,682.8,"aka Long off"],["Third man",205.8,195,"aka Deep third"],["Fine leg",455.5,201,"aka Deep fine leg"],["Deep backward square leg",566.2,336.8],["Backward square leg",441.2,368.5],["Square leg",444.8,408.5],["Mid wicket",447.8,466],["Deep mid wicket",558.2,585.8],["Mid on",367.8,590],["Long on",473.8,690.8]];
const F={cx:326.75,cy:453.5,rx:284.75,ry:314.5},PT={x:303,y:389.5,w:39.5,h:99.5},AX=PT.x+PT.w/2;
const R=PT.h/6;                 // scoring circle: diameter = 1/3 of pitch length
const TIERS=[[0.15,5,"Bullseye!"],[0.5,3,"Great spot"],[0.75,2,"Close"],[1,1,"Just in"]];
const MAXPTS=POS.length*5;
/* Shared leaderboard (optional): fill in to use a Supabase table instead of this device's storage. */
const REMOTE={url:"https://zbwriyexthhtnfptefqc.supabase.co",key:"sb_publishable_XgXgqvHcPP52vkqRuX7C_Q_rCCudnr4"};

const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg",svg=$("field");
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate=iso=>iso?new Date(iso).toLocaleDateString("en-NZ",{day:"numeric",month:"short",year:"numeric"}):"";
let S={name:"",hand:"R",placed:{},pending:null};
const tgt=n=>{const p=POS.find(q=>q[0]===n);return {x:S.hand==="L"?2*AX-p[1]:p[1],y:p[2]}};
const inField=(x,y)=>((x-F.cx)/F.rx)**2+((y-F.cy)/F.ry)**2<=1;
const score=d=>{const r=d/R;for(const t of TIERS)if(r<=t[0])return t;return [9,0,"Not quite"]};
const raw=()=>Object.values(S.placed).reduce((a,b)=>a+b.pts,0);
const total=()=>Math.max(0,raw()-(S.ddp||0));

/* ---------- Storage: shared team leaderboard (Supabase). Every finished game is saved online.
   If the phone is offline, the game is held on the device and sent automatically next time. ---------- */
const KEY="setTheField.v1",QKEY=KEY+".pending";
const H={apikey:REMOTE.key,"Content-Type":"application/json"};
const Store={
 queue(){try{return JSON.parse(localStorage.getItem(QKEY))||[]}catch(e){return []}},
 saveQueue(q){try{q.length?localStorage.setItem(QKEY,JSON.stringify(q)):localStorage.removeItem(QKEY)}catch(e){}},
 async send(a){const r=await fetch(REMOTE.url+"/rest/v1/field_attempts",{method:"POST",headers:{...H,Prefer:"return=minimal"},
   body:JSON.stringify({name:a.name.trim().slice(0,24),score:a.score,raw:a.raw,ddp:a.ddp,hand:a.hand,points:a.points})});
  if(!r.ok)throw new Error("save "+r.status)},
 async flush(){const q=this.queue();if(!q.length)return;const left=[];
  for(const a of q){try{await this.send(a)}catch(e){left.push(a)}}this.saveQueue(left)},
 async list(){try{await this.flush();
   const r=await fetch(REMOTE.url+"/rest/v1/field_leaderboard?select=*&order=best.desc,best_date.asc&limit=200",{headers:H});
   if(!r.ok)throw new Error("list "+r.status);
   return (await r.json()).map(x=>({name:x.name,best:x.best,bestDate:x.best_date,bestDdp:x.best_ddp,plays:x.plays}))}catch(e){return null}},
 async record(a){const before=((await this.list())||[]).find(p=>p.name.toLowerCase()===a.name.trim().toLowerCase());
  try{await this.send(a);a.saved=true}catch(e){const q=this.queue();q.push(a);this.saveQueue(q.slice(-20));a.saved=false}
  return !before||a.score>before.best}
};

/* ---------- Field drawing ---------- */
function drawBase(){
 const b=$("base");b.innerHTML="";
 el("ellipse",{cx:F.cx,cy:F.cy,rx:F.rx,ry:F.ry,fill:"url(#mow)"},b);
 el("ellipse",{cx:F.cx,cy:F.cy,rx:F.rx,ry:F.ry,fill:"url(#mowv)"},b);
 el("ellipse",{class:"night",cx:F.cx,cy:F.cy,rx:F.rx,ry:F.ry,fill:"url(#flood)"},b);
 drawLights(b);
 el("ellipse",{cx:F.cx,cy:F.cy,rx:F.rx-3,ry:F.ry-3,fill:"none",style:"stroke:var(--rope)","stroke-width":3},b);
 el("ellipse",{cx:AX,cy:PT.y+PT.h/2,rx:F.rx*.52,ry:F.ry*.5,fill:"none",stroke:"#fff","stroke-opacity":.45,"stroke-width":1.5,"stroke-dasharray":"6 7"},b);
 const ck=el("g",{class:"clock"},b);
 for(let h=1;h<=12;h++){const a=h*Math.PI/6,s=Math.sin(a),c=Math.cos(a);
  el("line",{x1:F.cx,y1:F.cy,x2:F.cx+F.rx*s,y2:F.cy-F.ry*c,stroke:"#fff","stroke-opacity":h%3?0.12:0.35,"stroke-width":1.2,"stroke-dasharray":"5 6"},ck);
  const t=el("text",{x:F.cx+(F.rx+22)*s,y:F.cy-(F.ry+22)*c+8,"text-anchor":"middle","font-size":24,"font-family":"Oswald,Arial Narrow,Roboto Condensed,sans-serif","font-weight":600,style:"fill:var(--ink)"},ck);t.textContent=h}
 el("rect",{x:PT.x,y:PT.y,width:PT.w,height:PT.h,rx:3,style:"fill:var(--pitch)"},b);
 /* Crease markings (Law 7), schematic. Widths use the pitch's own scale (pitch 3.05 m wide);
    lengths along the pitch are stretched so the markings stay readable.
    Bowling crease: through the stumps, 2.64 m long. Popping crease: 1.22 m in front of it, at least 1.83 m
    each side of middle stump. Return creases: 1.32 m each side of middle stump, from the popping crease
    back to 2.44 m behind it. */
 const u=PT.w/3.05,BC=1.32*u,PC=1.83*u+3,POP=8,RET=16;
 const ln=(x1,y1,x2,y2)=>el("line",{x1,y1,x2,y2,stroke:"#fff","stroke-width":1.3,"stroke-linecap":"square"},b);
 for(const [y,dir] of [[PT.y+10,1],[PT.y+PT.h-10,-1]]){const py=y+dir*POP,ry=py-dir*RET;
  ln(AX-BC,y,AX+BC,y);                      // bowling crease
  ln(AX-PC,py,AX+PC,py);                    // popping crease
  for(const sx of [-1,1])ln(AX+sx*BC,py,AX+sx*BC,ry); // return creases
  for(const dx of [-3.2,0,3.2])el("circle",{cx:AX+dx,cy:y,r:1.5,fill:"#5a3b1a",stroke:"#fff","stroke-width":.5},b)}
 const L=S.hand==="L",side=(txt,x)=>{const t=el("text",{x,y:F.cy+18,"text-anchor":"middle","font-size":34,"font-family":"Oswald,Arial Narrow,Roboto Condensed,sans-serif","font-weight":600,fill:"#fff","fill-opacity":.3},b);t.textContent=txt};
 side(L?"LEG SIDE":"OFF SIDE",140);side(L?"OFF SIDE":"LEG SIDE",518);
 const tb=el("text",{x:AX,y:PT.y+PT.h/2+4,"text-anchor":"middle","font-size":11,"font-family":"Oswald,Arial Narrow,Roboto Condensed,sans-serif","font-weight":600,fill:"#13301c"},b);tb.textContent=L?"BAT (LH)":"BAT (RH)";
 drawPlayers(b,L);
}
const FONT="Oswald,Arial Narrow,Roboto Condensed,sans-serif";
function tag(b,x,y,txt,anchor){const t=el("text",{x,y,"text-anchor":anchor||"middle","font-size":11,"font-family":FONT,"font-weight":600,fill:"#fff","paint-order":"stroke",stroke:"#0006","stroke-width":2.5},b);t.textContent=txt}
function person(b,x,y){const g=el("g",{transform:`translate(${x} ${y})`},b);
 el("path",{d:"M-8 14Q-8 6.5 0 6.5Q8 6.5 8 14Z",fill:"#fff",stroke:"#152764","stroke-width":1.4},g);
 el("circle",{r:4.8,fill:"#fff",stroke:"#152764","stroke-width":1.4},g);return g}
function drawPlayers(b,L){
 const mx=x=>L?2*AX-x:x,flip=L?-1:1;
 /* Wicket keeper, standing back, with gloves just beneath */
 const kx=mx(323.2);person(b,kx,359);
 /* Keeping gloves: padded gauntlets held together, fingers down towards the stumps, thumbs out, webbing, palm pads */
 for(const d of [-1,1]){const g=el("g",{transform:`translate(${kx+d*5.6} 370) scale(${d*.92} .92)`},b);
  el("path",{d:"M4.4 5Q9.6 5.2 9 10.2Q8.6 12.6 6 11.6L4.6 10.4Z",fill:"#f7f4ea",stroke:"#152764","stroke-width":.9},g);   // thumb + web
  el("path",{d:"M-4.6 3.2H4.6L5 10.6Q5 15.2 0 15.2Q-5 15.2 -5 10.6Z",fill:"#f7f4ea",stroke:"#152764","stroke-width":.9},g); // mitt
  el("rect",{x:-3.2,y:5,width:6.4,height:5.4,rx:1.6,fill:"#87325B"},g);                                                    // palm pad
  for(const fx of [-1.7,0,1.7])el("line",{x1:fx,y1:11,x2:fx,y2:14.6,stroke:"#9aa0ad","stroke-width":.6},g);                // finger seams
  el("rect",{x:-4.8,y:0,width:9.6,height:3.6,rx:1,fill:"#152764"},g)}                                                       // cuff
 tag(b,kx+flip*14,366,"KEEPER",L?"end":"start");
 /* Batter at the striker's end, bat held on the diagonal */
 /* Right-hander: batter on the right of the stumps, bat on the left angled the other way; left-hander mirrors it */
 const bm=x=>L?x:2*AX-x,bf=L?1:-1;
 const bx=bm(AX-12);person(b,bx,401);
 const bt=el("g",{transform:`translate(${bm(AX-3)} 417) rotate(${bf*-38})`},b);
 el("rect",{x:-1.2,y:-14,width:2.4,height:7,rx:1,fill:"#6b3f1d"},bt);
 el("rect",{x:-3.2,y:-7.5,width:6.4,height:17,rx:2.2,fill:"#f3e2b3",stroke:"#7a5a2a","stroke-width":1},bt);
 tag(b,bx-bf*13,404,"BATTER",L?"end":"start");
 /* Bowler at the other end, with the ball beneath */
 const by=PT.y+PT.h+8;person(b,AX,by);
 /* ball held at the bowler's top right, overlapping the figure */
 el("circle",{cx:AX+8,cy:by+4,r:4.2,fill:"#b3121b",stroke:"#fff","stroke-width":1},b);
 el("path",{d:`M${AX+5.4} ${by+1}Q${AX+9.2} ${by+4} ${AX+5.4} ${by+7}`,fill:"none",stroke:"#fff","stroke-width":.8},b);
 tag(b,AX+16,by+15,"BOWLER","start");
}
function drawLights(b){
 const g=el("g",{class:"night lights"},b),cy=PT.y+PT.h/2;
 el("ellipse",{class:"dim",cx:F.cx,cy:F.cy,rx:F.rx,ry:F.ry,fill:"#000"},g);
 const pools=el("g",{filter:"url(#feather)"},el("g",{"clip-path":"url(#fclip)"},g));
 for(let i=0;i<6;i++){const a=(15+i*60)*Math.PI/180,tx=F.cx+(F.rx+14)*Math.sin(a),ty=F.cy-(F.ry+14)*Math.cos(a);
  const ang=Math.atan2(AX-tx,cy-ty)*180/Math.PI,W=118,Lg=270,bp=34;
  el("path",{class:"pool",transform:`translate(${tx} ${ty}) rotate(${-ang})`,fill:"url(#beam)",
   d:`M0 0L${-W} ${Lg}Q${-W*2/3} ${Lg+bp} ${-W/3} ${Lg}Q0 ${Lg+bp} ${W/3} ${Lg}Q${W*2/3} ${Lg+bp} ${W} ${Lg}Z`},pools);
  const t=el("g",{transform:`translate(${tx} ${ty}) rotate(${-ang})`},g);
  el("line",{x1:0,y1:-15,x2:0,y2:-2,stroke:"#c9ccd6","stroke-width":2},t);
  el("rect",{x:-8,y:-4,width:16,height:6,rx:1.5,fill:"#fff4c2",stroke:"#c9ccd6","stroke-width":1},t)}
}

/* ---------- Pins, marks and labels ---------- */
const k=()=>{const m=svg.getScreenCTM();return (m&&m.a)||1};
const sc=()=>Math.min(2.2,Math.max(.22,1.05/k()));
const ctx=document.createElement("canvas").getContext("2d");
const tw=(t,fs)=>{ctx.font=`600 ${fs}px ${getComputedStyle(document.documentElement).getPropertyValue("--cond")}`;return ctx.measureText(t).width};
const TCOL=p=>p>=5?"#e8a917":p>=3?"#2f9e44":p>=2?"#7fb800":p>=1?"#f08c00":"#c62d2d";

function pin(x,y,cls){const s=sc(),g=el("g",{transform:`translate(${x} ${y}) scale(${s})`,class:cls||""});
 el("path",{d:"M0 0 C-3 -9 -11 -14 -11 -24 A11 11 0 1 1 11 -24 C11 -14 3 -9 0 0Z",fill:"#c62d2d",stroke:"#fff","stroke-width":1.6},g);
 el("circle",{cy:-24,r:4.2,fill:"#fff"},g);
 el("circle",{r:2.6,fill:"none",stroke:"#fff","stroke-width":1.2},g);el("circle",{r:.9,fill:"#13301c"},g);return g}

function render(){
 const m=$("marks"),lb=$("labels"),pl=$("pinLayer");m.innerHTML=lb.innerHTML=pl.innerHTML="";
 const s=sc(),items=[];
 for(const [n,a] of Object.entries(S.placed)){const t=tgt(n),c=TCOL(a.pts);
  el("line",{x1:a.x,y1:a.y,x2:t.x,y2:t.y,stroke:"#fff","stroke-width":1.4,"stroke-dasharray":"3 3"},m);
  el("circle",{cx:t.x,cy:t.y,r:R,fill:c,"fill-opacity":.28,stroke:c,"stroke-width":2.2},m);
  el("path",{d:`M${t.x-4} ${t.y-4}L${t.x+4} ${t.y+4}M${t.x+4} ${t.y-4}L${t.x-4} ${t.y+4}`,stroke:"#13301c","stroke-width":2.2},m);
  el("circle",{cx:a.x,cy:a.y,r:3.4*Math.min(s,1.6),fill:c,stroke:"#fff","stroke-width":1.4},m);
  items.push({x:t.x,y:t.y,t:k()<.7?n:`${n}  +${a.pts}`,gap:R+2})}
 if(S.pending){const p=S.pending;pl.appendChild(pin(p.x,p.y,"pend"));items.push({x:p.x,y:p.y-30*s,t:p.name,gap:4,pend:1,fixed:"top"})}
 placeLabels(items,s,lb);updateHud();
}
function placeLabels(items,s,layer){
 const kk=k(),fs=(kk<.7?11.5:13)/kk,h=fs*1.45,boxes=[],ov=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
 const obst=items.map(i=>({x:i.x-4,y:i.y-4,w:8,h:8}));
 const order=items.map((it,i)=>({it,i,c:items.filter(o=>Math.hypot(o.x-it.x,o.y-it.y)<120).length})).sort((a,b)=>(b.it.pend?99:b.c)-(a.it.pend?99:a.c));
 for(const {it} of order){const w=tw(it.t,fs)+fs*.9,g=it.gap*1,c=[[g,-h/2],[-g-w,-h/2],[-w/2,-g-h],[-w/2,g],[g*.75,-g*.75-h],[-g*.75-w,-g*.75-h],[g*.75,g*.75],[-g*.75-w,g*.75],[g+12,-h/2-h],[-g-12-w,-h/2+h]];
  const cands=it.fixed?[[-w/2,-g-h]]:c;let best=null,bc=1e9;
  cands.forEach(([dx,dy],i)=>{const b={x:it.x+dx,y:it.y+dy,w,h};let cost=i*.5;
   for(const o of boxes)cost+=ov(b,o)*4;for(const o of obst)cost+=ov(b,o)*2;
   if(b.x<2||b.x+w>653||b.y<102||b.y+h>810)cost+=1e7;if(cost<bc){bc=cost;best=b}});
  boxes.push(best);
  const g2=el("g",{class:"lbl"+(it.pend?" pend":"")},layer);
  if(!it.pend){const lx=Math.max(best.x,Math.min(it.x,best.x+w)),ly=Math.max(best.y,Math.min(it.y,best.y+h));
   if(Math.hypot(lx-it.x,ly-it.y)>it.gap+3)el("line",{x1:it.x,y1:it.y,x2:lx,y2:ly,stroke:"#fff","stroke-width":1.2/kk},g2)}
  el("rect",{x:best.x,y:best.y,width:w,height:h,rx:h/2.4,"stroke-width":1},g2);
  const t=el("text",{x:best.x+w/2,y:best.y+h*.72,"text-anchor":"middle","font-size":fs},g2);t.textContent=it.t;
  g2.addEventListener("pointerenter",()=>layer.appendChild(g2))}
}
function updateHud(){const n=Object.keys(S.placed).length;$("score").textContent=`${total()} pts · ${n}/${POS.length}`+(S.ddp?` · DDP ${S.ddp}`:"");
 $("chips").innerHTML=POS.map(([n,,,aka])=>{const a=S.placed[n],p=S.pending&&S.pending.name===n;
  return `<button class="chip${a?" done":""}${p?" pending":""}" data-n="${esc(n)}"${aka?` title="${aka}"`:""} ${a?'aria-disabled="true"':""}><span>${esc(n)}</span>${a?`<span class="pts">+${a.pts}</span>`:""}</button>`}).join("")}

/* ---------- Dragging ---------- */
let drag=null;const ghost=$("ghost"),hint=$("hint");
function toField(cx,cy){const p=new DOMPoint(cx,cy).matrixTransform(svg.getScreenCTM().inverse());return {x:p.x,y:p.y}}
function start(n,e){if(!S.playing){startScreen();return}if(S.pending&&S.pending.name!==n){toast("Lock in or move "+S.pending.name+" first");return}
 e.preventDefault();hidePop();drag={n,touch:e.pointerType!=="mouse",id:e.pointerId};ghost.textContent=n;move(e)}
function move(e){if(!drag||e.pointerId!==drag.id)return;const off=drag.touch?48:0,p=toField(e.clientX,e.clientY-off);
 drag.p=p;const inside=inField(p.x,p.y);ghost.hidden=inside;ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";
 S.pending=inside?{name:drag.n,x:p.x,y:p.y}:(S.pending&&S.pending.name===drag.n?null:S.pending);render();
 const t=tgt(drag.n),d=Math.hypot(p.x-t.x,p.y-t.y);
 if(inside&&d<=2*R){hint.setAttribute("cx",t.x);hint.setAttribute("cy",t.y);hint.setAttribute("r",R);hint.setAttribute("opacity",(.15+.5*(1-d/(2*R))).toFixed(2))}else hint.setAttribute("opacity",0)}
function end(e){if(!drag||e.pointerId!==drag.id)return;move(e);ghost.hidden=true;hint.setAttribute("opacity",0);drag=null;render();if(S.pending)showPop()}
$("chips").addEventListener("pointerdown",e=>{const c=e.target.closest(".chip");if(c&&!S.placed[c.dataset.n])start(c.dataset.n,e)});
$("pinLayer").addEventListener("pointerdown",e=>{if(S.pending)start(S.pending.name,e)});
addEventListener("pointermove",move);addEventListener("pointerup",end);addEventListener("pointercancel",end);

/* ---------- Hint: circles show only while the button is held ---------- */
function showHints(on){const h=$("hints");h.innerHTML="";$("tHint").setAttribute("aria-pressed",on);if(!on)return;
 for(const [n] of POS){const t=tgt(n);el("circle",{cx:t.x,cy:t.y,r:R,fill:"#fff","fill-opacity":.18,stroke:"#fff","stroke-width":1.8,"stroke-dasharray":"4 3"},h)}}
const th=$("tHint");let holding=false;
const hintOn=e=>{if(holding)return;holding=true;if(e&&e.pointerId!=null)try{th.setPointerCapture(e.pointerId)}catch(x){}addDDP("hint");showHints(true)};
const hintOff=()=>{if(!holding)return;holding=false;showHints(false)};
th.addEventListener("pointerdown",e=>{e.preventDefault();hintOn(e)});
for(const ev of ["pointerup","pointercancel","lostpointercapture"])th.addEventListener(ev,hintOff);
th.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat){e.preventDefault();hintOn()}});
th.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")hintOff()});th.addEventListener("blur",hintOff);
th.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- Distraction deduction points ---------- */
function addDDP(why){if(!S.playing)return;S.ddp=(S.ddp||0)+1;updateHud();toast(`Distraction: −1 point (${why})`)}

/* ---------- Confirm + score ---------- */
const pop=$("pop");
function showPop(){const p=S.pending,w=$("wrap").getBoundingClientRect(),q=new DOMPoint(p.x,p.y).matrixTransform(svg.getScreenCTM());
 pop.hidden=false;const pw=pop.offsetWidth,ph=pop.offsetHeight,sx=q.x-w.left,sy=q.y-w.top;
 let top=sy-38*sc()*k()-ph-10;if(top<6)top=sy+14;
 pop.style.left=Math.max(6,Math.min(w.width-pw-6,sx-pw/2))+"px";pop.style.top=top+"px";$("pYes").focus({preventScroll:true})}
function hidePop(){pop.hidden=true}
$("pMove").onclick=()=>{hidePop();const g=$("pinLayer").firstChild;if(g){g.firstChild.classList.add("pulse")}toast("Drag the pin to move it")};
$("pYes").onclick=()=>{const p=S.pending,t=tgt(p.name),d=Math.hypot(p.x-t.x,p.y-t.y),[,pts,msg]=score(d);
 S.placed[p.name]={x:p.x,y:p.y,pts};S.pending=null;hidePop();render();toast(`${msg}  +${pts}`);
 if(Object.keys(S.placed).length===POS.length)setTimeout(finish,900)};
let tt;function toast(m){const t=$("toast");t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,1700)}

/* ---------- Screens ---------- */
const ov=$("ov"),card=$("card");
function lbTable(list){if(!list)return `<p class="note">Can&rsquo;t reach the team leaderboard right now. Check the internet connection and try again.</p>`;if(!list.length)return `<p class="note">No scores yet. Be the first on the board.</p>`;
 return `<table><thead><tr><th>#</th><th>Player</th><th class="n">Best</th><th class="n" title="Distraction deduction points in that game">DDP</th><th>When</th><th class="n">Plays</th></tr></thead><tbody>${list.slice(0,30).map((p,i)=>
 `<tr class="${p.name.toLowerCase()===S.name.toLowerCase()?"me":""}"><td>${i+1}</td><td>${esc(p.name)}</td><td class="n">${p.best}/${MAXPTS}</td><td class="n">${p.bestDdp==null?"–":p.bestDdp?"−"+p.bestDdp:"0"}</td><td>${fmtDate(p.bestDate)}</td><td class="n">${p.plays}</td></tr>`).join("")}</tbody></table>`}
async function startScreen(){
 let last="";try{last=localStorage.getItem(KEY+".name")||""}catch(e){}S.name=S.name||last;
 card.innerHTML=`<h2>Can you set the field?</h2><p>Drag all ${POS.length} positions onto the oval. Land the pin inside the hidden circle to score, up to 5 points each.</p><p><b style="color:var(--ink)">Play it like a real match:</b> each hint press, and switching on the clock face or night mode, is a distraction deduction point (DDP) and costs you 1 point.</p>
 <label class="f" for="nm">Your name</label><input type="text" id="nm" maxlength="24" autocomplete="off" value="${esc(S.name)}" placeholder="First name">
 <label class="f">Set the field for a</label><div class="seg"><button data-h="R" aria-pressed="${S.hand==="R"}">Right-hander</button><button data-h="L" aria-pressed="${S.hand==="L"}">Left-hander</button></div>
 <button class="go" id="go">Start</button><div class="lb"><h3>Leaderboard</h3><div id="lbt"><p class="note">Loading…</p></div></div>
 <p class="note">Scores are saved to the team leaderboard online, so everyone sees everyone&rsquo;s best. Use the same name each time.</p>`;
 ov.hidden=false;
 card.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.hand=b.dataset.h;card.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
 $("go").onclick=()=>{const v=$("nm").value.trim();if(!v){$("nm").focus();$("nm").placeholder="Type your name first";return}
  S.name=v;try{localStorage.setItem(KEY+".name",v)}catch(e){}newGame();drawBase();render()};
 $("lbt").innerHTML=lbTable(await Store.list());
}
function newGame(){S.placed={};S.pending=null;S.playing=true;ov.hidden=true;
 S.ddp=(svg.classList.contains("showclock")?1:0)+(root.dataset.theme==="dark"?1:0);
 if(S.ddp)toast(`Clock face or night mode is on: ${S.ddp} DDP`)}
async function finish(){S.playing=false;const sc2=total(),rw=raw(),dd=S.ddp||0,date=new Date().toISOString();
 const points={};for(const [n,a] of Object.entries(S.placed))points[n]=a.pts;
 const att={name:S.name,score:sc2,raw:rw,ddp:dd,hand:S.hand,date,points};const pb=await Store.record(att);const list=await Store.list();
 const rank=(list||[]).findIndex(p=>p.name.toLowerCase()===S.name.toLowerCase())+1;
 const worst=Object.entries(points).sort((a,b)=>a[1]-b[1]).filter(x=>x[1]<3).slice(0,5);
 card.innerHTML=`<p style="margin:0">${esc(S.name)}, you scored</p><div class="big">${sc2}<span style="font-size:.45em;color:var(--muted)"> / ${MAXPTS}</span></div>
 <p>${rw} placement points${dd?` − ${dd} distraction deduction${dd>1?"s":""} (DDP)`:" and no distractions. Real match conditions!"}</p>
 <p>${att.saved?`${pb?"That's a new personal best!":"Your best stays on the board."}${rank?` You're #${rank} on the team leaderboard.`:""}`:"No internet just now, so this score is saved on this phone and will go on the team leaderboard next time you play online."}</p>
 ${worst.length?`<p><b style="color:var(--ink)">Practise these:</b> ${worst.map(w=>`${esc(w[0])} (${w[1]})`).join(", ")}</p>`:"<p>Every position scored 3 or more. Superb fielding knowledge.</p>"}
 <button class="go" id="again">Play again</button><button class="go alt" id="who">Change player</button><button class="go alt" id="look">Look at my field</button>
 <div class="lb"><h3>Leaderboard</h3>${lbTable(list)}</div>`;ov.hidden=false;
 $("again").onclick=()=>{newGame();render()};$("who").onclick=()=>{S.name="";S.playing=false;startScreen()};
 $("look").onclick=()=>{ov.hidden=true;toast("Tap New game when you're ready for another go")};}

/* ---------- Toggles ---------- */
const root=document.documentElement,tc=$("tClock"),tn=$("tNight");
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
const syncNight=()=>{const d=isDark();tn.setAttribute("aria-pressed",d);$("luxWrap").hidden=!d};syncNight();
tn.onclick=()=>{const d=!isDark();root.dataset.theme=d?"dark":"light";syncNight();if(d)addDDP("night mode")};
$("lux").addEventListener("input",e=>svg.style.setProperty("--lux",e.target.value/100));
tc.onclick=()=>{const on=!svg.classList.contains("showclock");svg.classList.toggle("showclock",on);tc.setAttribute("aria-pressed",on);if(on)addDDP("clock face")};
const again=document.createElement("button");again.className="tog";again.textContent="New game";again.onclick=()=>startScreen();$("score").after(again);
new ResizeObserver(()=>{render();if(S.pending&&!pop.hidden)showPop()}).observe(svg);
/* ---------- Field zoom: pinch, wheel, buttons; drag the grass to pan. The list never zooms. ---------- */
const B={x:0,y:100,w:655,h:712},V={...B},MAXZ=4;
function setView(){V.w=Math.min(B.w,Math.max(B.w/MAXZ,V.w));V.h=V.w*B.h/B.w;
 V.x=Math.min(B.x+B.w-V.w,Math.max(B.x,V.x));V.y=Math.min(B.y+B.h-V.h,Math.max(B.y,V.y));
 svg.setAttribute("viewBox",`${V.x} ${V.y} ${V.w} ${V.h}`);const z=B.w/V.w;
 $("zReset").hidden=z<1.01;$("zReset").textContent=(Math.round(z*10)/10)+"×";
 render();if(S.pending&&!pop.hidden)showPop()}
function zoomAt(f,c){const nw=V.w/f,r=nw/V.w;V.x=c.x-(c.x-V.x)*r;V.y=c.y-(c.y-V.y)*r;V.w=nw;setView()}
const mid=()=>({x:V.x+V.w/2,y:V.y+V.h/2});
$("zIn").onclick=()=>zoomAt(1.5,mid());$("zOut").onclick=()=>zoomAt(1/1.5,mid());
$("zReset").onclick=()=>{Object.assign(V,B);setView()};
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0018),toField(e.clientX,e.clientY))},{passive:false});
const touches=new Map();let gest=null;
svg.addEventListener("pointerdown",e=>{if(drag||e.target.closest("#pinLayer"))return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});try{svg.setPointerCapture(e.pointerId)}catch(x){}
 const p=[...touches.values()];gest=p.length>=2?{d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),m:{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}}:{m:p[0]}});
svg.addEventListener("pointermove",e=>{if(!touches.has(e.pointerId)||drag)return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const p=[...touches.values()],kk=k();
 if(p.length>=2&&gest&&gest.d){const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),m={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
  V.x-=(m.x-gest.m.x)/kk;V.y-=(m.y-gest.m.y)/kk;zoomAt(d/gest.d,toField(m.x,m.y));gest={d,m}}
 else if(p.length===1&&gest&&V.w<B.w){V.x-=(p[0].x-gest.m.x)/kk;V.y-=(p[0].y-gest.m.y)/kk;gest={m:p[0]};setView()}});
for(const ev of ["pointerup","pointercancel"])svg.addEventListener(ev,e=>{touches.delete(e.pointerId);const p=[...touches.values()];gest=p.length?{m:p[0]}:null});
const closeOv=()=>{ov.hidden=true;if(!S.playing)toast("Pick any position to start a game")};
$("ovx").onclick=closeOv;ov.addEventListener("click",e=>{if(e.target===ov)closeOv()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!ov.hidden)closeOv()});
drawBase();render();startScreen();
document.fonts&&document.fonts.ready.then(render);
}
</script>
